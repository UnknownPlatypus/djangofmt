[graph]
all-features = true

[licenses]
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[bans]
wildcards = "deny"
allow-wildcard-paths = true
workspace-dependencies = { duplicates = "deny", include-path-dependencies = true, unused = "deny" }

[sources]
required-git-spec = "rev"
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/UnknownPlatypus/malva",
  "https://github.com/UnknownPlatypus/markup_fmt",
]
