[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs nightly and panics by design, keep it out of normal builds.
exclude = ["fuzz"]

[workspace.package]
version = "1.1.0"
authors = ["Thibaut Decombe <thibaut.decombe@gmail.com>"]
# Please update rustfmt.toml when bumping the Rust edition
edition = "2024"
rust-version = "1.97.0"
repository = "https://github.com/UnknownPlatypus/djangofmt"
license = "MIT"

[workspace.dependencies]
anyhow = { version = "1.0.102" }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete_command = { version = "0.6.1" }
divan = { package = "codspeed-divan-compat", version = "5.0.2" }
djangofmt = { path = "crates/djangofmt", default-features = false }
djangofmt_formatter = { path = "crates/djangofmt_formatter" }
djangofmt_lint = { path = "crates/djangofmt_lint" }
djangofmt_macros = { path = "crates/djangofmt_macros" }
djangofmt_syntax = { path = "crates/djangofmt_syntax" }
dprint-plugin-json = { version = "0.25.0" }
editorconfig-parser = { version = "0.0.4" }
globset = { version = "0.4.18" }
ignore = { version = "0.4.25" }
insta = { version = "1.47.2", features = ["filters", "glob", "yaml"] }
insta-cmd = { version = "0.7.0" }
malva = {
  git = "https://github.com/UnknownPlatypus/malva",
  rev = "9a7ee71bfad747490ebe0428d07d1f82467f0c3f",
  features = ["config_serde"],
}
markup_fmt = {
  git = "https://github.com/UnknownPlatypus/markup_fmt",
  rev = "82ba55ca86570c88788a8c526fdfdf939a6adfd8",
}
memchr = { version = "2.8.3" }
miette = { package = "oxc-miette", version = "3.0.1", features = ["fancy"] }
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
rayon = { version = "1.12.0" }
regex = { version = "1.12.3" }
rstest = { version = "=0.27.0" }
rustc-hash = { version = "2.1.2" }
rustywind_core = {
  version = "0.7.0",
  # No `runtime-rng`: its getrandom dependency doesn't build for the wasm playground.
  default-features = false
}
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5" }
similar-asserts = { version = "2.0.0" }
smallvec = { version = "1.15.1", features = ["const_new"] }
strsim = { version = "0.11.1" }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0" }
tempfile = { version = "3.27.0" }
textwrap = { version = "0.16.2" }
thiserror = { version = "2.0.18" }
# This has to be kept in sync with src/main.rs where the allocator for the program is set.
tikv-jemallocator = { version = "0.7.0" }
toml = { version = "1.1.2" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
tracing-tree = { version = "0.4.1" }
tsify = { version = "0.5.6" }
wasm-bindgen = { version = "0.2.122" }

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
wildcard_dependencies = "deny"

# Opt-outs; new restriction lints are on by default, so they surface on toolchain bumps.
# Contradict idiomatic Rust or how this codebase is written.
absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
as_conversions = "allow"
definition_in_module_root = "allow"
else_if_without_else = "allow"
error_impl_error = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
inline_modules = "allow"
inline_trait_bounds = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
map_err_ignore = "allow"
min_ident_chars = "allow"
missing_asserts_for_indexing = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
module_name_repetitions = "allow"
partial_pub_fields = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
question_mark_used = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
tests_outside_test_module = "allow"
unreachable = "allow"
use_debug = "allow"

# Pure taste, no bug or clarity gain.
ref_patterns = "allow"
return_and_then = "allow"
str_to_string = "allow"
unused_trait_names = "allow"

# Opposite of a convention we already follow.
mod_module_files = "allow"
pub_with_shorthand = "allow"
semicolon_outside_block = "allow"
unseparated_literal_suffix = "allow"

# Not applicable: no_std, published API stability, overflow-critical math.
arithmetic_side_effects = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
non_ascii_literal = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"

# Offsets come from the parser; `.get().expect()` would not be safer.
indexing_slicing = "allow"
string_slice = "allow"

# Listing every markup_fmt variant/field would bury the matches that matter.
rest_pattern_accessible_field = "allow"
wildcard_enum_match_arm = "allow"

# Enabling the whole restriction group is the point.
blanket_clippy_restriction_lints = "allow"

[workspace.lints.rust]
ambiguous_negative_literals = "deny"
missing_debug_implementations = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"

[profile.dev]
# Faster builds, backtraces still work.
debug = "line-tables-only"

[profile.release]
strip = true
# See python/benchmark_cargo_profiles.py
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Used by cargo-mutants, see .cargo/mutants.toml
[profile.mutants]
inherits = "test"
debug = "none"
