[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs nightly and panics by design, keep it out of normal builds.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.12"
authors = ["Thibaut Decombe <thibaut.decombe@gmail.com>"]
# Please update rustfmt.toml when bumping the Rust edition
edition = "2024"
rust-version = "1.96.0"
repository = "https://github.com/UnknownPlatypus/djangofmt"
license = "MIT"

[workspace.dependencies]
anyhow = { version = "1.0.102" }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete_command = { version = "0.6.1" }
divan = { package = "codspeed-divan-compat", version = "*" }
djangofmt_macros = { path = "crates/djangofmt_macros" }
dprint-plugin-json = { version = "0.23.0" }
editorconfig-parser = { version = "0.0.4" }
globset = { version = "0.4.18" }
ignore = { version = "0.4.25" }
insta = { version = "1.47.2", features = ["filters", "glob", "yaml"] }
insta-cmd = { version = "0.7.0" }
malva = {
  git = "https://github.com/UnknownPlatypus/malva",
  rev = "375681ea53921df556517f5fbbfa73d5c1c3900c",
  features = ["config_serde"]
}
markup_fmt = {
  git = "https://github.com/UnknownPlatypus/markup_fmt",
  rev = "5dfcc78156b9d8266d72a200c08c8a1237a7b76c"
}
miette = { package = "oxc-miette", version = "3.0.1", features = ["fancy"] }
proc-macro2 = { version = "1.0" }
quote = { version = "1.0" }
rayon = { version = "1.12.0" }
rstest = { version = "=0.26.1" }
rustc-hash = { version = "2.1.2" }
rustywind_core = {
  version = "0.7.0",
  # No `runtime-rng`: its getrandom dependency doesn't build for the wasm playground.
  default-features = false
}
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5" }
similar-asserts = { version = "2.0.0" }
smallvec = { version = "1.15.1", features = ["const_new"] }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0" }
tempfile = { version = "3.27.0" }
textwrap = { version = "0.16.2" }
thiserror = { version = "2.0.18" }
# This has to be kept in sync with src/main.rs where the allocator for the program is set.
tikv-jemallocator = { version = "0.7.0" }
toml = { version = "1.1.2" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
tracing-tree = { version = "0.4.1" }
tsify = { version = "0.5.6" }
wasm-bindgen = { version = "0.2.122" }

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
get_unwrap = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"  # iteration order must be explicit; output must stay deterministic
large_include_file = "deny"
map_with_unused_argument_over_ranges = "deny"
missing_errors_doc = "allow"
non_zero_suggestions = "deny"
nursery = { level = "deny", priority = -1 }
pathbuf_init_then_push = "deny"
pedantic = { level = "deny", priority = -1 }
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"

[profile.release]
strip = true
# See python/benchmark_cargo_profiles.py
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
