# This workflow is based on the example provided by CodSpeedHQ
# See https://codspeed.io/docs/guides/how-to-benchmark-rust-code
name: "[djangofmt] CodSpeed Benchmarks"

on:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - uv.lock
      - .github/workflows/codspeed.yml
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions: # optional for public repositories
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

env:
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.13.9
  UV_CHECKSUM: 0797542018e541a9288855df555c8077eed06f7a47d206362030480e8ecc9f3d # aarch64-unknown-linux-gnu

concurrency:
  # A new push supersedes a PR's run, but every main commit keeps its baseline run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    # Unlike `ubuntu-latest`'s mix of Intel and AMD CPUs, every arm runner is a Neoverse-N2.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false

      - name: Build the benchmark target(s)
        run: uv run --only-dev cargo codspeed build -p djangofmt_benchmark --profile profiling
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          cycle-estimation: false
          run: uv run --only-dev cargo codspeed run -p djangofmt_benchmark
