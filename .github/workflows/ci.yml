name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.12.21
  # renovate: datasource=github-releases depName=astral-sh/hawk
  HAWK_VERSION: 0.1.15
  # Fail instead of silently re-resolving when `uv.lock` is out of date.
  UV_LOCKED: 1
  # Make sure CI fails on all warnings, including Clippy lints
  CARGO_BUILD_WARNINGS: deny

jobs:
  changed_files:
    name: "Determine which files changed"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check if code changed
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        # HEAD is the PR merge commit, its first parent is the base branch tip.
        run: |
          git diff --quiet HEAD^1 HEAD -- \
            'python/**' \
            'crates/**' \
            .github/workflows/ci.yml \
            .gitattributes \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            rustfmt.toml \
            clippy.toml \
            deny.toml \
            || echo "code=true" >> "$GITHUB_OUTPUT"

  build-and-compare:
    name: "Ecosystem check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed_files
    if: ${{ github.event_name == 'pull_request' && needs.changed_files.outputs.code == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Build main version
        run: cargo build --locked -p djangofmt --release --verbose && mv target/release/djangofmt ./main_djangofmt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Build PR version
        run: cargo build --locked -p djangofmt --release --verbose && mv target/release/djangofmt ./pr_djangofmt

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install rustywind
        run: |
          npm ci --prefix python/benchmarks
          echo "$PWD/python/benchmarks/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run `djangofmt` ecosystem check
        id: ecosystem
        env:
          # djangofmt was built above, don't rebuild it via project install and maturin
          UV_NO_PROJECT: 1
        run: |
          uv venv --python 3.12
          uv pip install ./python/ecosystem-check

          # Each check prints one status line, plus collapsed details when it found something.
          # The blank line in between stops a trailing `<details>` from swallowing the next status line.
          uv run ecosystem-check format ./main_djangofmt ./pr_djangofmt --cache-dir ./checkouts --title "\`pr\` vs \`main\` format diff" | tee -a ecosystem-result
          echo >> ecosystem-result
          uv run ecosystem-check format ./pr_djangofmt ./pr_djangofmt --cache-dir ./checkouts --format-comparison base-then-comp --title "\`pr\` format stability" | tee -a ecosystem-result
          echo >> ecosystem-result
          uv run ecosystem-check format rustywind ./pr_djangofmt --cache-dir ./checkouts --format-comparison base-then-comp-converge --title "\`pr\` + \`rustywind\` format stability" | tee -a ecosystem-result
          echo >> ecosystem-result
          uv run ecosystem-check format djade ./pr_djangofmt --cache-dir ./checkouts --format-comparison base-then-comp-converge --title "\`pr\` + \`djade\` format stability" | tee -a ecosystem-result
          echo >> ecosystem-result
          uv run ecosystem-check check ./main_djangofmt ./pr_djangofmt --cache-dir ./checkouts --title "\`pr\` vs \`main\` check diff" | tee -a ecosystem-result
          echo >> ecosystem-result
          # Keep going on failure so the summary, comment and artifacts are still produced.
          validate_status=0
          uv run ecosystem-check validate ./pr_djangofmt --cache-dir ./checkouts --title "\`pr\` parse check" | tee -a ecosystem-result || validate_status=$?
          echo "validate_status=${validate_status}" >> "$GITHUB_OUTPUT"

          if [ "$(stat -c%s "ecosystem-result")" -gt 1024000 ]; then
            echo -e "\n\n> [!CAUTION]\n> **Summary Truncated:** The original output was $(du -h ecosystem-result | cut -f1), which exceeds GitHub's 1024k limit." >> "$GITHUB_STEP_SUMMARY"
          fi

          head -c 1000k ecosystem-result >> "$GITHUB_STEP_SUMMARY"

      - name: Generate comment content
        id: generate-comment
        run: |
          # Note this identifier is used to find the comment to update on subsequent runs
          echo '<!-- generated-comment ecosystem -->' >> placeholder-comment.txt

          {
            cat placeholder-comment.txt
            echo "## \`ecosystem-check\` results"
            cat ecosystem-result
          } > full-comment.txt

          # GitHub rejects comment bodies over 65536 characters
          if [ "$(wc -c < full-comment.txt)" -gt 65536 ]; then
              {
                cat placeholder-comment.txt
                echo "## \`ecosystem-check\` results (partial, see full diff [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
                # Drop the last line: it may be cut mid-way through a multi-byte character
                head -c 64000 ecosystem-result | head -n -1
                printf '\n\n> [!CAUTION]\n> **Truncated:** the full output is %s.\n' "$(du -h ecosystem-result | cut -f1)"
              } > full-comment.txt
          fi

      - name: Upload ecosystem result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-result
          path: full-comment.txt

      - name: Store pr-number
        run: |
          echo ${{ github.event.number }} > pr-number

      - name: Upload pr-number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-number
          path: pr-number

      - name: Fail on parse regressions
        if: steps.ecosystem.outputs.validate_status != '0'
        run: exit 1

  clippy_check:
    name: "cargo clippy"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup component add clippy
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features

  cargo-shear-deny:
    name: "cargo shear + deny"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv run --only-dev cargo shear
      - if: ${{ !cancelled() }}
        run: uv run --only-dev cargo deny check licenses sources bans

  hawk:
    name: "cargo hawk"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hawk only runs on the exact toolchain it was built for, keep HAWK_VERSION in step with rust-toolchain.toml.
      - name: Install hawk
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
      - name: Find dead pub items
        run: cargo hawk check --only dead-public -D warnings

  test:
    name: "cargo test + coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run tests with coverage, rejecting orphaned snapshot files
        run: |
          eval "$(uv run --only-dev cargo llvm-cov show-env --sh)"
          uv run --only-dev cargo insta test --unreferenced reject --workspace --lib --bins --tests --all-features
          uv run --only-dev cargo llvm-cov report --fail-under-lines 85 --ignore-filename-regex 'djangofmt_(dev|benchmark)/'

  test-other:
    name: "cargo test (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests --all-features --no-fail-fast

  msrv_check:
    name: "cargo check (msrv)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changed_files
    if: ${{ needs.changed_files.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].rust_version')
          echo "value=${MSRV}" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: rustup toolchain install "${MSRV}"
      - name: Check with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: cargo "+${MSRV}" check --locked --workspace --all-targets --all-features
