# This is done in a separate workflow because pull_request workflow cannot write comments from forks.
# This is inspired from various pr-comment jobs in the ruff repo https://github.com/astral-sh/ruff/tree/main/.github/workflows
# See also https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#restrictions-on-repository-forks
name: Ecosystem Check PR comment

on: # zizmor: ignore[dangerous-triggers] # We mitigate potential issues in `Skip symlinks` step
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: The CI workflow that triggers the workflow run
        required: true

# `github.ref` is always `main` on `workflow_run`, so key on the triggering run's source branch
# (a newer push to a PR supersedes its pending comment); `workflow_dispatch` has no such payload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI runs on pushes to main too, but only PRs produce an ecosystem result to comment.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        name: Download pull request number
        with:
          name: pr-number
          run_id: ${{ github.event.workflow_run.id ||  github.event.inputs.workflow_run_id }}
          if_no_artifact_found: ignore
          allow_forks: true

      - name: Parse pull request number
        id: pr-number
        run: |
          if [[ -f pr-number ]]
          then
              # This artifact is built by the fork's own CI run, so anything but a
              # plain number means it was tampered with.
              pr_number="$(<pr-number)"
              if [[ ! "$pr_number" =~ ^[0-9]{1,10}$ ]]
              then
                  echo "Error: pr-number must be a plain number"
                  exit 1
              fi
              echo "pr-number=${pr_number}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        name: "Download ecosystem check results"
        id: download-ecosystem-result
        if: steps.pr-number.outputs.pr-number
        with:
          name: ecosystem-result
          workflow: ci.yml
          pr: ${{ steps.pr-number.outputs.pr-number }}
          workflow_conclusion: completed
          if_no_artifact_found: ignore
          allow_forks: true

      - name: Skip symlinks
        id: skip-symlink
        if: steps.download-ecosystem-result.outputs.found_artifact == 'true'
        run: |
          # Guard against malicious ecosystem results that symlink to a secret
          # file on this runner
          if [[ -L full-comment.txt ]]
          then
              echo "Error: full-comment.txt cannot be a symlink"
              exit 1
          fi

      - name: Create or update comment
        if: steps.skip-symlink.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-number.outputs.pr-number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file full-comment.txt \
            --edit-last \
            --create-if-none
