# Publish a release to PyPI.
#
# Should be part of `publish-jobs` in `dist-workspace.toml` configuration.
# See https://opensource.axo.dev/cargo-dist/book/reference/config.html#publish-jobs
name: "[djangofmt] Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Release artifacts must not be built from caches that other workflows can write.
env:
  ACTIONS_CACHE_MODE: none
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.12.23
  UV_CHECKSUM: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6 # x86_64-unknown-linux-gnu

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    env:
      UV_PUBLISH_USERNAME: ${{ vars.UV_PUBLISH_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.UV_PUBLISH_PASSWORD }}
      UV_PUBLISH_URL: ${{ vars.UV_PUBLISH_URL }}
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          # `setup-uv` caches by default and ignores `ACTIONS_CACHE_MODE`.
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPi
        run: uv publish -v wheels/*
