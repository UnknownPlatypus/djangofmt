# Publish a release to PyPI.
#
# Should be part of `publish-jobs` in `dist-workspace.toml` configuration.
# See https://opensource.axo.dev/cargo-dist/book/reference/config.html#publish-jobs
name: "[djangofmt] Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Release artifacts must not be built from caches that other workflows can write.
env:
  ACTIONS_CACHE_MODE: none
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.13.1
  UV_CHECKSUM: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220 # x86_64-unknown-linux-gnu

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          # `setup-uv` caches by default and ignores `ACTIONS_CACHE_MODE`.
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPi
        run: uv publish -v wheels/*
