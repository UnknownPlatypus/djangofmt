# Publish a release to PyPI.
#
# Should be part of `publish-jobs` in `dist-workspace.toml` configuration.
# See https://opensource.axo.dev/cargo-dist/book/reference/config.html#publish-jobs
name: "[djangofmt] Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Release artifacts must not be built from caches that other workflows can write.
env:
  ACTIONS_CACHE_MODE: none

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      # Unlike `uv publish`, uploads PEP 740 attestations (astral-sh/uv#15618).
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: wheels/
