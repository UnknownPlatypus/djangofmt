# Publish a release to PyPI.
#
# Should be part of `publish-jobs` in `dist-workspace.toml` configuration.
# See https://opensource.axo.dev/cargo-dist/book/reference/config.html#publish-jobs
name: "[djangofmt] Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Release artifacts must not be built from caches that other workflows can write.
env:
  ACTIONS_CACHE_MODE: none

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    env:
      UV_PUBLISH_USERNAME: ${{ vars.UV_PUBLISH_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.UV_PUBLISH_PASSWORD }}
      UV_PUBLISH_URL: ${{ vars.UV_PUBLISH_URL }}
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `setup-uv` caches by default and ignores `ACTIONS_CACHE_MODE`.
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPi
        run: uv publish -v wheels/*
