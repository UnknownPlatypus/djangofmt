# Builds the playground (Deno + WASM) and the Zensical docs site, then
# deploys both as a single GitHub Pages artifact: playground at `/`, docs
# at `/docs/`.
name: "[djangofmt] Publish Playground and Docs"

on:
  # Runs during release workflow
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run build (no deploy) on PRs touching playground, docs, their sources, or build config
  pull_request:
    paths:
      - "playground/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/djangofmt/src/**"
      - "crates/djangofmt_formatter/src/**"
      - "crates/djangofmt_lint/src/**"
      - "crates/djangofmt_syntax/src/**"
      - "crates/djangofmt_macros/**"
      - "crates/djangofmt_dev/**"
      - "crates/djangofmt_wasm/**"
      - ".github/workflows/publish-playground-and-docs.yml"

permissions: {}

env:
  # Fail instead of silently re-resolving when `uv.lock` is out of date.
  UV_LOCKED: 1
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.13.7
  UV_CHECKSUM: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83 # x86_64-unknown-linux-gnu
  # renovate: datasource=github-release-attachments depName=wasm-bindgen/wasm-pack
  WASM_PACK_VERSION: v0.15.1
  WASM_PACK_CHECKSUM: 410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2 # x86_64-unknown-linux-musl

# Scope the concurrency group per PR so simultaneous PR builds don't cancel each other.
# `main` deploys (and workflow_dispatch / workflow_call runs) share a single `pages-deploy`
# group, since GitHub Pages itself only accepts one deploy at a time.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/wasm-pack.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_CHECKSUM}  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C ~/.cargo/bin --strip-components=1 \
            "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
      - name: "Run wasm-pack build"
        run: wasm-pack build --target web crates/djangofmt_wasm --out-dir ../../playground/pkg
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "v2.9.8"
      - name: Install playground dependencies
        run: deno install --frozen
        working-directory: playground
      - name: Build playground
        run: deno task build
        working-directory: playground
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          # Release runs deploy this build, so they must not read a cache PRs can write.
          enable-cache: ${{ github.event_name == 'pull_request' }}
      - name: Regenerate rule docs and synced pages
        run: cargo run --locked -p djangofmt_dev -- generate-all
      - name: Sync docs dependencies
        run: uv sync --group docs --no-install-project
      - name: Build docs site
        run: uv run --no-sync zensical build --clean --strict --config-file .mkdocs.yml
      - name: Stage combined Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -r playground/dist/. _site/
          mkdir -p _site/docs
          cp -r site/. _site/docs/
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "_site"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment: github-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
