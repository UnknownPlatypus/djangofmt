# Builds the playground (Deno + WASM) and the Zensical docs site, then
# deploys both as a single GitHub Pages artifact: playground at `/`, docs
# at `/docs/`.
name: "[djangofmt] Publish Playground and Docs"

on:
  # Runs during release workflow
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run build (no deploy) on PRs touching playground, docs, their sources, or build config
  pull_request:
    paths:
      - "playground/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/djangofmt/src/**"
      - "crates/djangofmt_formatter/src/**"
      - "crates/djangofmt_lint/src/**"
      - "crates/djangofmt_syntax/src/**"
      - "crates/djangofmt_macros/**"
      - "crates/djangofmt_dev/**"
      - "crates/djangofmt_wasm/**"
      - ".github/workflows/publish-playground-and-docs.yml"

permissions: {}

env:
  # Fail instead of silently re-resolving when `uv.lock` is out of date.
  UV_LOCKED: 1
  # renovate: datasource=github-release-attachments depName=astral-sh/uv
  UV_VERSION: 0.13.0
  UV_CHECKSUM: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154 # x86_64-unknown-linux-gnu

# Scope the concurrency group per PR so simultaneous PR builds don't cancel each other.
# `main` deploys (and workflow_dispatch / workflow_call runs) share a single `pages-deploy`
# group, since GitHub Pages itself only accepts one deploy at a time.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0
      - name: "Run wasm-pack build"
        run: wasm-pack build --target web crates/djangofmt_wasm --out-dir ../../playground/pkg
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: Install playground dependencies
        run: deno install --frozen
        working-directory: playground
      - name: Build playground
        run: deno task build
        working-directory: playground
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          # Release runs deploy this build, so they must not read a cache PRs can write.
          enable-cache: ${{ github.event_name == 'pull_request' }}
      - name: Regenerate rule docs and synced pages
        run: cargo run --locked -p djangofmt_dev -- generate-all
      - name: Sync docs dependencies
        run: uv sync --group docs --no-install-project
      - name: Build docs site
        run: uv run --no-sync zensical build --clean --strict --config-file .mkdocs.yml
      - name: Stage combined Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -r playground/dist/. _site/
          mkdir -p _site/docs
          cp -r site/. _site/docs/
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment: github-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
