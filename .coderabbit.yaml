# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
early_access: true
reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  poem: false
  review_status: false
  # Snapshots are ignored by default, which makes the reviewer flag fixtures as missing their `.snap`.
  path_filters:
    - "**/*.snap"
  tools:
    htmlhint:
      enabled: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
    drafts: false
    base_branches:
      - main
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

chat:
  auto_reply: true
  art: false

knowledge_base:
  web_search:
    enabled: true

issue_enrichment:
  auto_enrich:
    enabled: false
