# Formatter and syntax are mostly covered by the CLI snapshot tests,
# so every mutant must run these crates' tests, not only its own.
test_package = ["djangofmt", "djangofmt_formatter", "djangofmt_lint", "djangofmt_syntax"]
exclude_globs = [
  "crates/djangofmt_benchmark/**",
  "crates/djangofmt_dev/**",
  "crates/djangofmt_wasm/**",
  "crates/djangofmt_macros/**",
  # Only `djangofmt_dev` reads it, to generate the settings docs.
  "crates/djangofmt/src/options_metadata.rs",
]
# Text no test asserts: fix titles only show under `--show-fixes`, the rest in docs and error messages.
exclude_re = [
  "::fix_title -> ",
  "Display for (FixAvailability|IndentWidth|LineLength|RuleSelector|SelectionWarning|SelectorParseError)>",
  "Debug for RuleSet>",
  "category_list -> ",
]
all_features = true
additional_cargo_test_args = ["--lib", "--bins", "--tests"]
gitignore = true
profile = "mutants"
