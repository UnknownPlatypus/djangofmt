[workspace]
members = ["cargo:."]

# We do this override because cargo-dist assume the min GLIBC supported version is 2.31 otherwise.
# https://opensource.axo.dev/cargo-dist/book/reference/config.html#min-glibc-version
[workspace.metadata.dist.min-glibc-version]
# Override glibc version for specific target triplets.
aarch64-unknown-linux-gnu = "2.28"
# Override all remaining glibc versions.
"*" = "2.17"

# Config for 'dist'
[dist]
# `release.yml` is hand-patched, so `dist` must not verify or regenerate it.
# To see the patches to re-apply after `dist init`,
# drop `allow-dirty` and diff a fresh `dist generate`.
allow-dirty = ["ci"]
# Must match the `astral-dev-toolchain-cargo-dist` pin in pyproject.toml, which CI runs.
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "aarch64-pc-windows-msvc",
  "arm-unknown-linux-musleabihf",
  "armv7-unknown-linux-gnueabihf",
  "armv7-unknown-linux-musleabihf",
  "x86_64-apple-darwin",
  "powerpc64le-unknown-linux-gnu",
  "riscv64gc-unknown-linux-gnu",
  "s390x-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "i686-unknown-linux-gnu",
  "i686-unknown-linux-musl",
  "i686-pc-windows-msvc",
]
# Whether to auto-include files like READMEs, LICENSEEs, and CHANGELOGs (default true)
auto-includes = false
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true
# Which phase dist should use to create the GitHub release
github-release = "announce"
# Whether to generate GitHub build provenance attestations
github-attestations = true
# Which phase dist should use to create the attestations
github-attestations-phase = "announce"
# Which release files to attest
github-attestations-filters = ["*.json", "*.sh", "*.ps1", "*.zip", "*.tar.gz"]
# Whether CI should include auto-generated code to build local artifacts
build-local-artifacts = false
# Local artifacts jobs to run in CI
local-artifacts-jobs = ["./release-build-binaries"]
# Publish jobs to run in CI
publish-jobs = ["./release-publish-pypi"]
# Custom permissions for GitHub Jobs
github-custom-job-permissions = { "publish-playground-and-docs" = { pages = "write", id-token = "write" } }
# Post-announce jobs to run in CI
post-announce-jobs = [
  "./release-notify-pre-commit-mirror",
  "./publish-playground-and-docs",
]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"  # v4.2.2
