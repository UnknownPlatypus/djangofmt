<!-- A pair is renamed as one, keeping its options and its `plural` -->
<!-- Django: tests/template_tests/syntax_tests/i18n/test_blocktranslate.py::i18n26 -->
{% load i18n %}{% blocktrans with extra_field=myextra_field count counter=number %}singular {{ extra_field }}{% plural %}plural{% endblocktrans %}

<input placeholder="{% trans 'Search' %}">
