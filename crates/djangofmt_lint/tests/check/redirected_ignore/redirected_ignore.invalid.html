<!-- Legacy formatter directive in an HTML comment -->
<!-- djangofmt:ignore -->
<div   class="kept"  ></div>

<!-- A suppression in an HTML comment silently does nothing -->
<!-- djangofmt: ignore[invalid-attr-value] -->
<form method="yes"></form>

<!-- No spaces around the directive -->
<!--djangofmt:ignore-->
<div></div>

<!-- Whitespace around the colon, and the formatter's code -->
<!-- djangofmt : ignore[format] -->
<div   class="kept"  ></div>

<!-- Nested inside an element -->
<div>
  <!-- djangofmt:ignore -->
  <p     class="kept"  >hi</p>
</div>

<!-- Reported but left alone: Django's {# #} comments are single-line -->
<!-- djangofmt: ignore[invalid-attr-value]
     legacy markup, see #123 -->
<form method="yes"></form>

<!-- Reported but left alone: `#}` would end the new comment early -->
<!-- djangofmt:ignore #}{{ expression }} -->
<div   class="kept"  ></div>
