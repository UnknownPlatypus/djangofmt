<!-- Labelled multi-line block -->
{% block content %}
    <h1>{{ title }}</h1>
{% endblock content %}

<!-- Regression: djade #134 — a single-line block stays unlabelled -->
<title>{% block title %}Home{% endblock %}</title>

<!-- An unnamed block is a Django error, left alone -->
{% block %}
    <p>Unnamed</p>
{% endblock %}

<!-- `inline` is a partialdef option; on a block it is a Django error, left alone -->
{% block sidebar inline %}
    <nav>{{ menu }}</nav>
{% endblock %}
