<!-- The formatter's directive in an HTML comment -->
<!-- djangofmt:ignore -->
<div   class="kept"  ></div>

<!-- The same directive in a template comment: the right comment style, the legacy spelling -->
{# djangofmt:ignore #}
<div   class="kept"  ></div>
{# djangofmt:ignore third-party snippet #}
<div   class="kept"  ></div>

<!-- No spaces around the comment body -->
<!--djangofmt:ignore-->
<div></div>

<!-- Whitespace around the colon -->
<!-- djangofmt : ignore -->
<div   class="kept"  ></div>

<!-- A free-text reason is kept, colon or not -->
<!-- djangofmt:ignore legacy markup, see #123 -->
<div   class="kept"  ></div>
<!-- djangofmt:ignore : vendored widget -->
<div   class="kept"  ></div>

<!-- Extra dashes are dropped rather than becoming `{#-` / `-#}` whitespace control -->
<!--- djangofmt:ignore --->
<div   class="kept"  ></div>

<!-- Nested inside an element -->
<div>
  <!-- djangofmt:ignore -->
  <p     class="kept"  >hi</p>
</div>

<!-- Reported but left alone: Django's {# #} comments are single-line -->
<!-- djangofmt:ignore
     legacy markup, see #123 -->
<div   class="kept"  ></div>

<!-- Reported but left alone: `#}` would end the new comment early -->
<!-- djangofmt:ignore #}{{ expression }} -->
<div   class="kept"  ></div>
