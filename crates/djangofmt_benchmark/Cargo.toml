[package]
name = "djangofmt_benchmark"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "djangofmt Micro-benchmarks"
repository.workspace = true
license.workspace = true
publish = false

[lib]
bench = false
doctest = false
test = false

[[bench]]
harness = false
name = "formatter"

[[bench]]
harness = false
name = "linter"

[[bench]]
harness = false
name = "parser"

[[bench]]
harness = false
name = "reporter"

[[bench]]
harness = false
name = "summary"

[dependencies]
djangofmt = { path = "../djangofmt" }

[dev-dependencies]
divan = { workspace = true }
djangofmt_lint = { path = "../djangofmt_lint" }
miette = { workspace = true }

# Keep the cfg in sync with `src/lib.rs`, which declares the global allocator.
[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[lints]
workspace = true
