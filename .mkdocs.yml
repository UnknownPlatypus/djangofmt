# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: djangofmt
site_description: A fast, HTML aware, Django template formatter and linter, written in Rust.
site_url: https://unknownplatypus.github.io/djangofmt/docs/
repo_url: https://github.com/UnknownPlatypus/djangofmt
repo_name: UnknownPlatypus/djangofmt
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: docs/.overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - glightbox

# Declaring this key replaces zensical's defaults wholesale, so options it
# would have set (`line_spans`, the mermaid fence) must be repeated here.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      user: UnknownPlatypus
      repo: djangofmt
  - pymdownx.emoji

extra:
  # Surfaced as a button in the top bar by overrides/partials/header.html.
  playground_url: https://unknownplatypus.github.io/djangofmt/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Formatting:
      - formatting.md
      - known-limitations.md
  - Linting:
      - Running the linter: linter.md
      - rules.md
  - Settings: settings.md
  - Editor integration: editor-integration.md
  - Project:
      - benchmarks.md
      - contributing.md
      - changelog.md
